name: Infrastructure

# Infrastructure changes get the same treatment as code: validated on every PR,
# previewed against the live subscription before merge, applied only from main.
#
# `az deployment group what-if` is the step that matters. It prints exactly what
# would be created, modified or DELETED, on the PR, before anyone approves it.
# Reviewing a Bicep diff tells you what the template says; what-if tells you
# what will actually happen to the running platform.

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  RESOURCE_GROUP: rg-smart-factory
  LOCATION: switzerlandnorth

jobs:
  validate:
    name: Build and lint templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Bicep
        # Catches type errors, bad API versions and unresolvable references
        # without touching Azure at all. Runs on forks too, where there are no
        # cloud credentials.
        run: az bicep build --file infra/main.bicep --outfile /tmp/main.json

      - name: Lint Bicep
        run: |
          set -euo pipefail
          # Warnings are failures here. Left unenforced, linter output becomes
          # noise everyone scrolls past.
          OUTPUT=$(az bicep lint --file infra/main.bicep 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qE '\b(Warning|Error)\b'; then
            echo "::error::Bicep lint reported issues."
            exit 1
          fi
          echo "Lint clean."

  preview:
    name: Preview changes (what-if)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        id: whatif
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --result-format FullResourcePayload \
            > whatif.txt 2>&1 || true
          cat whatif.txt
          {
            echo "### Infrastructure what-if"
            echo ""
            echo '```'
            head -c 60000 whatif.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Apply to Azure
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output none

      - name: Deploy platform
        id: deploy
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "platform-${GITHUB_SHA::7}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --output json > outputs.json

          RAG_URL=$(jq -r '.properties.outputs.ragUrl.value' outputs.json)
          DEFECT_URL=$(jq -r '.properties.outputs.defectUrl.value' outputs.json)
          REGISTRY=$(jq -r '.properties.outputs.registryName.value' outputs.json)
          VAULT=$(jq -r '.properties.outputs.keyVaultName.value' outputs.json)

          {
            echo "### Platform deployed"
            echo ""
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| Registry | \`${REGISTRY}\` |"
            echo "| Key Vault | \`${VAULT}\` |"
            echo "| RAG service | ${RAG_URL} |"
            echo "| Defect service | ${DEFECT_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
